name: QoreLens product CI and Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --before=2026-11-07T21:15:57.730Z
      - run: npm run lint
      - run: npm run format:check
      - name: Verify build checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - run: npm run build
      - name: Verify build fingerprint provenance
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";

          const build = JSON.parse(readFileSync("dist/fingerprint.json", "utf8"));
          const sha256 = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
          assert.match(build.commit, /^[a-f0-9]{40}$/);
          assert.equal(build.commit, process.env.GITHUB_SHA);
          assert.match(build.ciRunId, /^[0-9]+$/);
          assert.equal(build.ciRunId, process.env.GITHUB_RUN_ID);
          assert.equal(build.dirty, false);
          assert.equal(build.bundleSha256, sha256("dist/app.js"));
          assert.equal(build.verifierSha256, sha256("dist/verifier.js"));
          JS
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: dist
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4.0.5
        id: deploy
